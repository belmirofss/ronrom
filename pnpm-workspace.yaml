packages:
  - web
  - studio

# Pacotes que podem rodar scripts de instalação (o pnpm bloqueia os demais).
# simple-git-hooks fica de fora: o hook é instalado pelo script `prepare` da raiz.
allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: false

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.6'
  - '@astrojs/prism@4.1.2'
  - '@astrojs/telemetry@3.4.2'
  - astro@7.4.4
