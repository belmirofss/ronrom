name: Tarefa
description: Funcionalidade nova, configuração ou manutenção.
body:
  - type: markdown
    attributes:
      value: |
        Depois de abrir, aplique um label de cada grupo (`area:*`, `tipo:*`, `prioridade:*`) (veja o CONTRIBUTING.md).
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por que essa tarefa existe e o que já foi decidido.
    validations:
      required: true
  - type: textarea
    id: o-que-fazer
    attributes:
      label: O que fazer
      description: Lista de passos verificáveis.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: criterios-de-aceite
    attributes:
      label: Critérios de aceite
      description: Como saber que a tarefa está pronta.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependências
      description: 'Issues que precisam ser concluídas antes (ex.: `- #2`).'
