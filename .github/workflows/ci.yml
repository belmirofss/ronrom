# Formatação, lint, diagnóstico de tipos e build. Sem branch protection no plano Free,
# estes checks são a principal barreira de qualidade: não faça merge com check vermelho.
# Repositório privado tem cota mensal de minutos do Actions, então o workflow é enxuto:
# dois jobs em paralelo, cache do store do pnpm e cancelamento de execuções antigas.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Num PR, um push novo cancela a execução anterior. Na main, cada merge roda até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # O hook de pré-commit não serve para nada no CI.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sem `version`: usa a versão do `packageManager` do package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Variáveis do GitHub (Settings > Secrets and variables > Actions). Sem valor
          # cadastrado, chegam vazias e o site usa o padrão do astro.config.mjs.
          # Sem as variáveis do Sanity, o build usa as fixtures: sem rede e sem segredo.
          # Veja docs/ambientes.md.
          SITE_URL: ${{ vars.SITE_URL }}
      # Usado pela checagem de links (#45) para não buildar de novo.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 3
          if-no-files-found: error
