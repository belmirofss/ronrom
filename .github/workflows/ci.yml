# Formatação, lint, diagnóstico de tipos, testes e build. Sem branch protection no plano Free,
# estes checks são a principal barreira de qualidade: não faça merge com check vermelho.
# Repositório privado tem cota mensal de minutos do Actions, então o workflow é enxuto:
# três jobs em paralelo, cache do store do pnpm e cancelamento de execuções antigas.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Num PR, um push novo cancela a execução anterior. Na main, cada merge roda até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # O hook de pré-commit não serve para nada no CI.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sem `version`: usa a versão do `packageManager` do package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      # Os tipos das consultas GROQ (#25) são versionados: o arquivo tem de ser o que o
      # `pnpm typegen` gera a partir dos schemas e das consultas deste commit. A extração do
      # schema não acessa o Sanity, então o project ID pode ser qualquer valor (e os PRs do
      # Dependabot, sem as variáveis do repositório, também passam).
      - run: pnpm typegen
        env:
          SANITY_STUDIO_PROJECT_ID: typegen
          SANITY_STUDIO_DATASET: development
      - name: tipos gerados atualizados
        run: |
          if ! git diff --exit-code -- web/src/lib/sanity/tipos.gerados.d.ts; then
            echo "::error file=web/src/lib/sanity/tipos.gerados.d.ts::Tipos desatualizados. Rode pnpm typegen e commite o arquivo."
            exit 1
          fi

  # Testes unitários e de componente (Vitest). O que cobrir: docs/testes.md.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Variáveis do GitHub (Settings > Secrets and variables > Actions). Sem valor
          # cadastrado, chegam vazias e o site usa o padrão do astro.config.mjs.
          # Sem as variáveis do Sanity, o build usa as fixtures: sem rede e sem segredo.
          # Veja docs/ambientes.md.
          SITE_URL: ${{ vars.SITE_URL }}
      # URL inexistente recebe o 404.html com status 404, servido pela CDN (#47).
      - run: node scripts/conferir-404.mjs
      # Usado pela checagem de links (#45) para não buildar de novo. Com o adapter da Vercel,
      # as páginas estáticas ficam em web/dist/client (a saída da Vercel é web/.vercel/output).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/client
          retention-days: 3
          if-no-files-found: error
