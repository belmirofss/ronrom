# Lighthouse CI (#60): Performance, Acessibilidade, Best Practices e SEO no celular, contra o deploy
# da Vercel. No preview de cada PR, falha se Acessibilidade, SEO ou Best Practices caírem abaixo
# de 95 ou se uma página passar do orçamento de tamanho; Performance e Core Web Vitals só avisam.
# Em produção, depois de cada merge, com a auditoria `is-crawlable`, tudo é erro. Configuração:
# lighthouserc.cjs e budget.json. Como ler o resultado: docs/performance.md.
name: lighthouse

# A Vercel deste projeto não cria GitHub Deployments nem manda repository_dispatch (conferido na
# #60), então nem `deployment_status` nem `repository_dispatch` disparam. O workflow roda no PR e
# na main e espera o commit status "Vercel – ronrom" do commit ficar verde.
on:
  pull_request:
  push:
    branches: [main]
  # Execução manual (Actions → lighthouse → Run workflow), contra qualquer deploy do site.
  workflow_dispatch:
    inputs:
      url:
        description: URL base do deploy, sem barra no final
        required: true
        default: https://ronrom.blog
      ambiente:
        description: preview (sem is-crawlable, Performance só avisa) ou producao
        type: choice
        options: [producao, preview]
        default: producao

permissions:
  contents: read
  # O comentário da Vercel no PR, com a URL do preview, e o status do deploy.
  pull-requests: read
  issues: read
  statuses: read

# Num PR, um push novo cancela a execução anterior. Na main, cada merge roda até o fim.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    name: lighthouse
    # Os PRs do Dependabot não recebem os secrets do Actions, e sem o segredo da Protection
    # Bypass o preview não abre. A atualização entra medida no merge, em produção.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Até 20 minutos esperando o build da Vercel, mais o Lighthouse.
    timeout-minutes: 30
    env:
      SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha || '') }}
      AMBIENTE: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || (github.event_name == 'push' && 'producao' || 'preview') }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A Vercel marca o commit com "Vercel – ronrom" em segundos depois do push: pendente no
      # build, verde quando o deploy fica pronto. Sem status nenhum em 3 minutos, o Ignored Build
      # Step pulou o deploy (PR só de docs/, .github/ ou .md), e não há o que medir.
      - name: espera o deploy da Vercel
        if: env.SHA != ''
        env:
          CONTEXTO: Vercel – ronrom
        run: |
          for tentativa in $(seq 1 80); do
            estado=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq "map(select(.context == env.CONTEXTO)) | first | .state // empty" || true)
            case "$estado" in
              success) echo "Deploy pronto."; exit 0 ;;
              failure | error)
                echo "::warning::O deploy da Vercel falhou ($estado): sem Lighthouse neste commit."
                echo "PULAR=true" >> "$GITHUB_ENV"
                exit 0 ;;
              '')
                if [ "$tentativa" -ge 12 ]; then
                  echo "::notice::Sem deploy da Vercel neste commit (Ignored Build Step): sem Lighthouse."
                  echo "PULAR=true" >> "$GITHUB_ENV"
                  exit 0
                fi ;;
            esac
            sleep 15
          done
          echo "::error::O deploy da Vercel não ficou pronto em 20 minutos."
          exit 1

      # Produção roda no domínio do site, o que o Google vê. O preview roda na URL da branch, que a
      # Vercel publica no comentário do PR (a primeira linha traz, em base64, um JSON com o
      # `previewUrl` de cada projeto) e que tem a Vercel Authentication: o segredo da Protection
      # Bypass for Automation passa por ela.
      - name: define a URL base
        if: env.PULAR != 'true'
        env:
          URL_MANUAL: ${{ inputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SITE_URL: ${{ vars.SITE_URL || 'https://ronrom.blog' }}
          SEGREDO: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -n "$URL_MANUAL" ]; then
            base=$URL_MANUAL
          elif [ "$AMBIENTE" = producao ]; then
            base=$SITE_URL
          else
            linha=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "vercel[bot]") | .body | split("\n")[0]' | head -n 1)
            base=$(printf '%s' "${linha##*:}" | base64 -d 2>/dev/null |
              jq -r '.projects[] | select(.name == "ronrom") | .previewUrl // empty' || true)
            if [ -z "$base" ]; then
              echo "::error::Não achei a URL do preview no comentário da Vercel no PR #$PR."
              exit 1
            fi
          fi
          case "$base" in http*) ;; *) base="https://$base" ;; esac
          if [ "$AMBIENTE" = preview ] && [ -z "$SEGREDO" ]; then
            echo "::error::Falta o secret VERCEL_AUTOMATION_BYPASS_SECRET (docs/performance.md#configuração)."
            exit 1
          fi
          echo "BASE=${base%/}" >> "$GITHUB_ENV"
          echo "Deploy: ${base%/} ($AMBIENTE)"

      # A URL da branch e o domínio de produção apontam para o deploy novo alguns segundos depois
      # de ele ficar pronto. O /api/health diz o commit no ar.
      - name: espera o deploy responder com o commit certo
        if: env.PULAR != 'true'
        env:
          SEGREDO: ${{ env.AMBIENTE == 'preview' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        run: |
          for tentativa in $(seq 1 30); do
            commit=$(curl -fsS --max-time 10 -H "x-vercel-protection-bypass: $SEGREDO" \
              "$BASE/api/health" | jq -r '.commit // empty' || true)
            if [ -n "$commit" ] && { [ -z "$SHA" ] || [ "$commit" = "$SHA" ]; }; then
              echo "No ar: $commit"
              exit 0
            fi
            echo "Tentativa $tentativa: commit no ar '${commit:-nenhum}', esperando $SHA."
            sleep 10
          done
          echo "::error::$BASE/api/health não respondeu com o commit $SHA em 5 minutos."
          exit 1

      # As 5 páginas de referência: home, um review, um pensamento, uma listagem e a busca. O
      # review e o pensamento são os mais recentes do /posts-index.json do próprio deploy, porque
      # o preview lê o dataset development e a produção, o production.
      - name: escolhe as páginas
        if: env.PULAR != 'true'
        env:
          SEGREDO: ${{ env.AMBIENTE == 'preview' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        run: |
          indice=$(curl -fsS --retry 3 --max-time 30 -H "x-vercel-protection-bypass: $SEGREDO" \
            "$BASE/posts-index.json")
          paginas="/"
          for tipo in review pensamento; do
            url=$(echo "$indice" | jq -r --arg tipo "$tipo" 'map(select(.tipo == $tipo)) | first | .url // empty')
            if [ -n "$url" ]; then
              paginas="$paginas $url"
            else
              echo "::warning::Nenhum $tipo publicado em $BASE: a página fica de fora."
            fi
          done
          paginas="$paginas /reviews /busca"
          {
            echo 'URLS<<FIM'
            for pagina in $paginas; do echo "$BASE$pagina"; done
            echo FIM
          } >> "$GITHUB_ENV"
          echo "Páginas: $paginas"

      # Sem o temporary-public-storage: os relatórios ficam só no artifact, que é privado.
      - id: lhci
        if: env.PULAR != 'true'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        env:
          LHCI_AMBIENTE: ${{ env.AMBIENTE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ env.AMBIENTE == 'preview' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        with:
          urls: ${{ env.URLS }}
          configPath: ./lighthouserc.cjs
          uploadArtifacts: false
          temporaryPublicStorage: false

      # O relatório guarda os cabeçalhos extras da coleta, inclusive o segredo: ele sai dos
      # arquivos antes do upload.
      - name: tira o segredo dos relatórios
        if: always()
        env:
          SEGREDO: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -n "$SEGREDO" ] && [ -d .lighthouseci ]; then
            grep -rlF -- "$SEGREDO" .lighthouseci | xargs -r sed -i "s|$SEGREDO|***|g"
          fi

      - name: resumo
        if: always()
        run: |
          [ -f .lighthouseci/manifest.json ] || exit 0
          {
            echo "### Lighthouse ($AMBIENTE, mediana de 3 execuções, celular)"
            echo
            echo '| Página | Performance | Acessibilidade | Best Practices | SEO |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r --arg base "$BASE" '.[] | select(.isRepresentativeRun) | .summary as $s |
              "| \(.url | ltrimstr($base) | if . == "" then "/" else . end) | \([$s.performance, $s.accessibility, $s["best-practices"], $s.seo] | map(. * 100 | round | tostring) | join(" | ")) |"' \
              .lighthouseci/manifest.json
            echo
            echo "Relatórios completos no artifact \`lighthouse-$AMBIENTE\` desta execução."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-${{ env.AMBIENTE }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
